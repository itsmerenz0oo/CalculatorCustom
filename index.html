<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zM4.6 7.3a5 5 0 016.8 0l-1.4 1.5a3 3 0 00-4 0zM2 4.7a9 9 0 0112 0L12.6 6.2a7 7 0 00-9.2 0z"/></svg>
        <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1.5" width="19" height="9" rx="2"/><rect x="21.5" y="4" width="1.5" height="4" fill="currentColor" stroke="none"/><rect x="2.5" y="3" width="15" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>

    <div class="pill">
      <button id="lightBtn" class="active" aria-label="Light mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="darkBtn" aria-label="Dark mode">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

    <div class="result-block">
      <div class="prev-expr" id="prevExpr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="card">
      <div class="toolrow">
        <span class="left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </span>
        <button class="close" id="closeBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        </button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key clear" data-action="clear">C</button>
        <button class="key" data-action="sign">+/-</button>
        <button class="key" data-action="percent">%</button>
        <button class="key op" data-op="/">÷</button>

        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key op" data-op="*">×</button>

        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key op" data-op="-">−</button>

        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key op" data-op="+">+</button>

        <button class="key wide">0</button>
        <button class="key">.</button>
        <button class="key op" data-action="equals">=</button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
